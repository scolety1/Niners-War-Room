[workspace]
members = [
  "apps/dynasty/src-tauri",
  "apps/redraft/src-tauri",
  "crates/nwr-desktop-runtime",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.77.2"

[workspace.dependencies]
hmac = "0.12"
nwr-desktop-runtime = { path = "crates/nwr-desktop-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5" }
tauri-build = { version = "2.5.6" }
tauri-plugin-single-instance = "2.4.3"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
